<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学 C++ 离线助教</title>
<script>
(function(){try{
  var t=localStorage.getItem("cppcourse.theme");
  if(t)document.documentElement.setAttribute("data-theme",t);
  var f=parseFloat(localStorage.getItem("cppcourse.fontscale"));
  if(f>0)document.documentElement.style.fontSize=(16*f)+"px";
}catch(e){}})();
</script>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* 学习进度（本页专用） */
  .progress-card { padding: 14px 20px; }
  .progress-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .progress-row .progress-label { font-weight: 700; }
  .progress-row .progress-num { color: var(--primary); font-weight: 700; font-family: var(--font-mono); }
  .progress-row #progress-reset { margin-left: auto; }
  .progress-track {
    height: 10px; border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--border); overflow: hidden; margin-top: 10px;
  }
  .progress-fill {
    height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--primary));
    transition: width .35s ease;
  }
  /* 目录卡片：“已学完”勾选 */
  .toc-item { position: relative; }
  .toc-item .t-link { display: block; color: inherit; }
  .toc-item .t-link:hover { text-decoration: none; }
  .toc-item .t-done {
    position: absolute; bottom: 14px; right: 14px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .76rem; color: var(--text-muted); cursor: pointer; user-select: none;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 10px;
  }
  .toc-item .t-done:hover { border-color: var(--primary); color: var(--primary); }
  .toc-item .t-done input { accent-color: var(--primary); margin: 0; cursor: pointer; }
  .toc-item.done { border-color: var(--accent); }
  .toc-item.done .t-done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  @media print { .progress-card, .toc-item .t-done { display: none !important; } }
</style>
</head>
<body>
<main class="container">

  <section class="hero">
    <h1>大学 C++ 离线助教</h1>
    <p>12 章 C++ 语法讲义：变量、指针、类、模板、STL、现代 C++。每章配示例、逐步执行和自测题，另附错误对照、速查表、易错点与排序算法专题。全部内容本地化，双击即用。</p>
    <div class="hero-btns">
      <a class="btn btn-solid" href="#toc">章节目录</a>
      <a class="btn" href="errors.html">错误博物馆</a>
      <a class="btn" href="exam-pitfalls.html">易错点</a>
      <a class="btn" href="templates/chapter-template.html">章节模板</a>
    </div>
    <p class="small" style="margin-top:14px;opacity:.85">示例输出为预置结果；真实编译请在本地使用 g++ / MSVC。</p>
  </section>

  <section class="card" id="search">
    <h2 style="margin-top:0">搜索</h2>
    <input type="search" id="q" class="search-input" style="width:100%;padding:10px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:1rem;font-family:inherit" placeholder="搜索章节 / 报错 / 速查条目 / 易错点…" autocomplete="off">
    <div class="search-results" id="results"></div>
  </section>

  <div class="section-head"><h2>专题</h2></div>
  <div class="special-grid" id="specials"></div>

  <div class="section-head" id="toc"><h2>章节目录</h2></div>
  <section class="card progress-card">
    <div class="progress-row">
      <span class="progress-label">📈 学习进度</span>
      <span class="progress-num" id="progress-num">0 / 0 章</span>
      <button class="btn btn-small" id="progress-reset" title="清除全部「已学完」标记">重置进度</button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <p class="muted small" style="margin:8px 0 0">点击各章节卡片右下角的「已学完」记录进度；数据保存在本机浏览器中，离线可用。</p>
  </section>
  <div class="toc-grid" id="toc-grid"></div>

  <div class="section-head"><h2>最近更新</h2></div>
  <div class="card" style="padding:10px 20px">
    <ul class="recent-list" id="recent"></ul>
  </div>

</main>

<script src="assets/js/highlight.js"></script>
<script src="assets/js/toc.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/interactive.js"></script>
<script src="assets/js/teacher.js"></script>
<script src="assets/js/mastery.js"></script>
<script src="assets/js/errors-data.js"></script>
<script src="assets/js/cheatsheets-data.js"></script>
<script src="assets/js/pitfalls-data.js"></script>
<script src="assets/js/sorting-data.js"></script>
<script>
(function () {
  "use strict";
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };

  /* 专题入口 */
  (function buildSpecials() {
    var box = document.getElementById("specials");
    (window.SPECIAL_PAGES || []).forEach(function (sp) {
      var a = document.createElement("a");
      a.className = "special-card " + (sp.cls || "");
      if (sp.file) a.href = sp.file;
      else { a.href = "javascript:void(0)"; a.title = "右上角开关 / ?teacher=1 / Ctrl+Alt+T"; }
      a.innerHTML = '<span class="sc-icon">' + sp.icon + "</span><h3>" + esc(sp.title) + "</h3><p>" + esc(sp.desc) + "</p>";
      box.appendChild(a);
    });
  })();

  var toc = window.COURSE_TOC || [];
  (function buildToc() {
    var grid = document.getElementById("toc-grid");
    toc.forEach(function (c, i) {
      var wrap = document.createElement("div");
      wrap.className = "toc-item";
      wrap.id = "toc-" + c.id;
      var a = document.createElement("a");
      a.className = "t-link";
      a.href = c.file;
      a.innerHTML =
        '<span class="t-no">' + String(i + 1).padStart(2, "0") + "</span>" +
        '<div class="t-title">' + esc(c.title) + "</div>" +
        '<div class="t-desc">' + esc(c.desc) + "</div>" +
        '<div class="t-meta"><span class="badge">' + esc(c.updated) + "</span></div>";
      wrap.appendChild(a);
      // 注意：勾选框必须是 <a> 的兄弟节点（不能放进链接内），否则点击会同时触发跳转
      var lab = document.createElement("label");
      lab.className = "t-done";
      lab.title = "标记本章已学完";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.addEventListener("change", function () { setDone(c.id, cb.checked); });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(" 已学完"));
      wrap.appendChild(lab);
      grid.appendChild(wrap);
    });
  })();

  /* ---------- 学习进度（localStorage 离线保存） ---------- */
  var PROG_KEY = "cppcourse.progress";
  function loadDone() {
    try {
      var v = JSON.parse(localStorage.getItem(PROG_KEY) || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function isDone(id) { return loadDone().indexOf(id) !== -1; }
  function setDone(id, on) {
    var ids = loadDone();
    var k = ids.indexOf(id);
    if (on && k === -1) ids.push(id);
    if (!on && k !== -1) ids.splice(k, 1);
    try { localStorage.setItem(PROG_KEY, JSON.stringify(ids)); } catch (e) {}
    updateProgress();
  }
  function updateProgress() {
    var done = 0;
    toc.forEach(function (c) {
      var on = isDone(c.id);
      if (on) done++;
      var w = document.getElementById("toc-" + c.id);
      if (!w) return;
      w.classList.toggle("done", on);
      var cb = w.querySelector(".t-done input");
      if (cb) cb.checked = on;
    });
    var total = toc.length;
    var num = document.getElementById("progress-num");
    num.textContent = (total && done === total)
      ? "🎉 全部完成！" + done + " / " + total + " 章"
      : done + " / " + total + " 章";
    document.getElementById("progress-fill").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
  }
  document.getElementById("progress-reset").addEventListener("click", function () {
    if (!confirm("确定清除全部「已学完」标记吗？")) return;
    try { localStorage.removeItem(PROG_KEY); } catch (e) {}
    updateProgress();
  });
  updateProgress();

  (function buildRecent() {
    var ul = document.getElementById("recent");
    var items = toc.slice().sort(function (a, b) { return b.updated < a.updated ? -1 : b.updated > a.updated ? 1 : 0; }).slice(0, 6);
    items.forEach(function (c) {
      var li = document.createElement("li");
      li.innerHTML = '<span class="r-date">' + esc(c.updated) + "</span><a href=\"" + c.file + '">' + esc(c.title) + "</a><span class='muted small'>" + esc(c.desc) + "</span>";
      ul.appendChild(li);
    });
  })();

  /* 全局搜索 */
  function buildCorpus() {
    var corpus = [];
    (window.COURSE_TOC || []).forEach(function (c) {
      corpus.push({ kind: "章节", title: c.title, text: (c.title + " " + c.desc + " " + (c.keywords || []).join(" ")).toLowerCase(), href: c.file });
    });
    (window.ERRORS_DATA || []).forEach(function (d) {
      corpus.push({ kind: "错误", title: d.title, text: (d.title + " " + d.message + " " + d.cause + " " + d.bad).toLowerCase(), href: "errors.html#" + d.id });
    });
    (window.CHEATSHEETS_DATA || []).forEach(function (s) {
      var t = s.title + " " + (s.desc || "");
      if (s.rows) t += " " + s.rows.flat().join(" ");
      if (s.items) t += " " + s.items.map(function (i) { return i.code + " " + i.desc; }).join(" ");
      corpus.push({ kind: "速查", title: s.title, text: t.toLowerCase(), href: "cheatsheets.html#" + s.id });
    });
    (window.PITFALLS_DATA || []).forEach(function (p) {
      corpus.push({ kind: "易错点", title: p.title, text: (p.title + " " + (p.tags || []).join(" ") + " " + p.why + " " + p.examQ).toLowerCase(), href: "exam-pitfalls.html#" + p.id });
    });
    (window.SORTING_DATA || []).forEach(function (d) {
      corpus.push({ kind: "排序", title: d.title, text: (d.title + " " + d.desc + " " + (d.keywords || []).join(" ")).toLowerCase(), href: "sorting.html#" + d.id });
    });
    return corpus;
  }
  var CORPUS = buildCorpus();
  var qInput = document.getElementById("q");
  var resBox = document.getElementById("results");
  qInput.addEventListener("input", function () {
    var kw = qInput.value.trim().toLowerCase();
    resBox.innerHTML = "";
    if (kw.length < 1) return;
    var hits = [];
    CORPUS.forEach(function (item) {
      var idx = item.text.indexOf(kw);
      if (idx !== -1) hits.push({ item: item, idx: idx });
    });
    hits.sort(function (a, b) { return a.item.kind.localeCompare(b.item.kind) || a.idx - b.idx; });
    hits.slice(0, 24).forEach(function (h) {
      var a = document.createElement("a");
      a.className = "sr-item";
      a.href = h.item.href;
      a.innerHTML = '<span class="sr-kind">' + h.item.kind + "</span>" + esc(h.item.title);
      resBox.appendChild(a);
    });
    if (!hits.length) resBox.innerHTML = '<span class="muted small">没有匹配内容。</span>';
  });
})();
</script>
</body>
</html>
